_schema-version: 3.3.0
ID: BookShop
description: A simple CAP project.
version: 1.0.1
modules:
  - name: BookShop-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: BookShop-db
      - name: BookShop-connectivity
      - name: BookShop-destination
      - name: BookShop-xsuaa
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: BookShop-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: BookShop-db
    parameters:
      buildpack: nodejs_buildpack
  - name: BookShop-app-deployer
    type: com.sap.application.content
    path: gen # <--- Ye important hai, sirf build results uthane ke liye
    requires:
      - name: BookShop-html5-repo-host
        parameters:
          content-target: true
      - name: BookShop-destination
    build-parameters:
      build-result: app/ # <--- HTML5 repo isi folder ko dekhta hai
      requires:
        - artifacts:
            - bookshop.zip
          name: bookshop
          target-path: app/
  - name: bookshop
    type: html5
    path: app/bookshop
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms:
        []
  - name: BookShop-destination-content
    type: com.sap.application.content
    requires:
      - name: BookShop-destination
        parameters:
          content-target: true
      - name: BookShop-html5-repo-host
        parameters:
          service-key:
            name: BookShop-html5-repo-host-key
      - name: BookShop-xsuaa
        parameters:
          service-key:
            name: BookShop-xsuaa-key
    parameters:
      content:
        instance:
          destinations:
            - Name: BookShop_html5_repo_host
              ServiceInstanceName: BookShop-html5-repo-host # <--- Yeh line add karo
              ServiceKeyName: BookShop-html5-repo-host-key
              sap.cloud.service: BookShop
            - Authentication: OAuth2UserTokenExchange
              Name: BookShop_xsuaa
              ServiceInstanceName: BookShop-xsuaa
              ServiceKeyName: BookShop-xsuaa-key
              sap.cloud.service: BookShop
          existing_destinations_policy: update # <--- 'ignore' ko 'update' kar do taaki changes apply ho sakein
    build-parameters:
      no-source: true
resources:
  - name: BookShop-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: BookShop-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
  - name: BookShop-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: BookShop-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: BookShop-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
      service: destination
      service-plan: lite
  - name: BookShop-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: BookShop-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production